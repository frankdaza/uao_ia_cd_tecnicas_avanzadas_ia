# Reglas de agrupacion previas a la ingesta Qdrant (corpus valledellili-org).
# Orden: el primer grupo cuyo patron_nombre coincida (fnmatch sobre el nombre del archivo) gana.
# patron_nombre puede ser una cadena o una lista de cadenas (cualquier patron coincide).
# archivo_salida es relativo a la raiz de salida del script (p. ej. valledellili-org/agrupado/...).

version: 1

grupos:
  - id: buscador_integral
    patron_nombre: "buscador-integral-q-*.md"
    archivo_salida: "agrupado/buscador-integral-consolidado.md"
    titulo: "Buscador integral de contenidos (fuentes consolidadas)"
    seccion: buscador-integral
    source_url_canonica: "https://valledellili.org/buscador-integral/"

  # Incluye fichas directorio-medico-*.md y la landing directorio-medico.md (sin sufijo de medico).
  - id: directorio_medico
    patron_nombre:
      - "directorio-medico-*.md"
      - "directorio-medico.md"
    archivo_salida: "agrupado/directorio-medico.md"
    titulo: "Directorio médico (fuentes consolidadas)"
    seccion: directorio-medico
    source_url_canonica: "https://valledellili.org/directorio-medico/"

  # Listados dinamicos (id opaco) antes del resto de servicios-*.
