# Hand TAAM — minimo TASK-119; ampliar en TASK-123 (SKILL, prompts, guardrails completos)
# Activacion: openfang hand install ... && openfang hand activate taam_lili_hand

[hand]
name = "taam_lili_hand"
version = "0.1.0"
description = "Seguimiento postoperatorio Bot Lili: recordatorios y solicitud de evidencias en texto"

[schedule]
# Cada 30 s (demo). El cron de 5 campos no admite sub-minuto; tz IANA para America/Bogota.
every_secs = 30
tz = "America/Bogota"

[capabilities]
recordatorio_postoperatorio = true
requerir_evidencia_texto = true

[guardrails]
no_diagnostico = true
disclaimer_obligatorio = true
escalar_palabras_alarma = [
  "dolor intenso",
  "fiebre alta",
  "sangrado",
  "dificultad respirar",
]

[channel]
default = "telegram"
