# Hand TAAM — manifesto taam_lili_hand (TASK-123)
# Activacion: openfang hand install ... && openfang hand activate taam_lili_hand

[hand]
name = "taam_lili_hand"
version = "0.1.0"
description = "Seguimiento postoperatorio Bot Lili: recordatorios y solicitud de evidencias en texto"

[schedule]
# Demo/desarrollo: tick cada 30 s (cron de 5 campos no admite sub-minuto).
every_secs = 30
tz = "America/Bogota"

[capabilities]
recordatorio_postoperatorio = true
requerir_evidencia_texto = true

[prompts]
recordatorio_postoperatorio = "prompts/recordatorio_postop.md"
requerir_evidencia_texto = "prompts/requerir_evidencia.md"

[guardrails]
no_diagnostico = true
disclaimer_obligatorio = true
escalar_palabras_alarma = [
  "dolor intenso",
  "fiebre alta",
  "sangrado abundante",
  "dificultad respiratoria",
]

[channel]
default = "telegram"
