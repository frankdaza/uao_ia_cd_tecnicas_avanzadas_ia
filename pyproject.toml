[project]
name = "uao-ia-cd-tecnicas-avanzadas-ia"
version = "0.1.0"
description = "MVP de Q&A sobre corpus Markdown con recuperación BM25 y Ollama (Módulo 1)."
authors = [
    { name = "Frank Edward Daza Gonzalez", email = "frank.daza2@gmail.com" },
    { name = "Alvaro Julián Barco Ocampo", email = "alvaro.barco@uao.edu.co" }
]
requires-python = "==3.12.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=7.1.0",
]

[tool.uv.build-backend]
module-name = "src"
