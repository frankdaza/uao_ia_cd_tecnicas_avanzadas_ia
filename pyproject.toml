[project]
name = "uao-ia-cd-tecnicas-avanzadas-ia"
version = "0.1.0"
description = "MVP de Q&A sobre corpus Markdown con recuperación BM25 y Ollama (Módulo 1)."
authors = [
    { name = "Frank Edward Daza Gonzalez", email = "frank.daza2@gmail.com" },
    { name = "Alvaro Julián Barco Ocampo", email = "alvaro.barco@uao.edu.co" }
]
requires-python = "==3.12.12"
dependencies = [
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    "beautifulsoup4>=4.14.3",
    "fastapi>=0.136.1",
    "gradio>=6.13.0",
    "langchain-core>=1.4.0",
    "langchain-openai>=1.2.1",
    "langchain-postgres>=0.0.17",
    "langgraph>=1.2.0",
    "llama-index-core>=0.14.21",
    "llama-index-embeddings-huggingface>=0.7.0",
    "llama-index-embeddings-openai>=0.6.0",
    "llama-index-vector-stores-qdrant>=0.10.1",
    "markdownify>=1.2.2",
    "nltk>=3.9.4",
    "numpy>=2.4.4",
    "openai>=2.32.0",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.14.0",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "qdrant-client>=1.18.0",
    "rank-bm25>=0.2.2",
    "requests>=2.33.1",
    "sqlalchemy[asyncio]>=2.0.49",
    "sse-starlette>=3.4.1",
    "uvicorn[standard]>=0.46.0",
]

[dependency-groups]
dev = [
    "anyio>=4.13.0",
    "httpx>=0.28.1",
    "jsonschema>=4.26.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "responses>=0.26.0",
]

[tool.uv.build-backend]
module-name = "src"
module-root = ""

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
markers = [
    "network: pruebas con red hacia un origen publico (activar con EJECUTAR_TESTS_CON_RED=1)",
    "integration_ollama: prueba contra Ollama local (se omite si no hay servidor)",
    "integration_postgres: prueba contra PostgreSQL real (activar con EJECUTAR_INTEGRACION_POSTGRES=1)",
    "integration_qdrant: prueba contra Qdrant en red (activar con EJECUTAR_INTEGRACION_QDRANT=1; sin Docker se omite)",
    "legacy: pruebas del modulo Gradio deprecado (conservadas como cobertura historica)",
    "legacy_bm25: pipeline M1 BM25 bajo src/legacy (excluir con pytest -m \"not legacy_bm25\")",
]
