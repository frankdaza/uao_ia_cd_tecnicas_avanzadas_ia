[project]
name = "uao-ia-cd-tecnicas-avanzadas-ia"
version = "0.1.0"
description = "MVP de Q&A sobre corpus Markdown con recuperación BM25 y Ollama (Módulo 1)."
authors = [
    { name = "Frank Edward Daza Gonzalez", email = "frank.daza2@gmail.com" },
    { name = "Alvaro Julián Barco Ocampo", email = "alvaro.barco@uao.edu.co" }
]
requires-python = "==3.12.12"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "markdownify>=1.2.2",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "requests>=2.33.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=7.1.0",
]

[tool.uv.build-backend]
module-name = "src"
module-root = ""

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
markers = [
    "network: pruebas con red hacia un origen publico (activar con EJECUTAR_TESTS_CON_RED=1)",
]
