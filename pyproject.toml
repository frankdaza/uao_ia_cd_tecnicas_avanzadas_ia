[project]
name = "uao-ia-cd-tecnicas-avanzadas-ia"
version = "0.1.0"
description = "MVP de Q&A sobre corpus Markdown con recuperación BM25 y Ollama (Módulo 1)."
authors = [
    { name = "Frank Edward Daza Gonzalez", email = "frank.daza2@gmail.com" },
    { name = "Alvaro Julián Barco Ocampo", email = "alvaro.barco@uao.edu.co" }
]
requires-python = "==3.12.12"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "fastapi>=0.136.1",
    "gradio>=6.13.0",
    "markdownify>=1.2.2",
    "nltk>=3.9.4",
    "numpy>=2.4.4",
    "openai>=2.32.0",
    "pydantic-settings>=2.14.0",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "rank-bm25>=0.2.2",
    "requests>=2.33.1",
    "sse-starlette>=3.4.1",
    "uvicorn[standard]>=0.46.0",
]

[dependency-groups]
dev = [
    "anyio>=4.13.0",
    "httpx>=0.28.1",
    "pytest>=8.0.0",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "responses>=0.26.0",
]

[tool.uv.build-backend]
module-name = "src"
module-root = ""

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
markers = [
    "network: pruebas con red hacia un origen publico (activar con EJECUTAR_TESTS_CON_RED=1)",
    "integration_ollama: prueba contra Ollama local (se omite si no hay servidor)",
    "legacy: pruebas del modulo Gradio deprecado (conservadas como cobertura historica)",
]
