[project]
name = "uao-taam"
version = "0.1.0"
description = "TAAM — Bot posoperatorio M3 (FastAPI, Telegram, LangChain Ruta A)."
authors = [
    { name = "Frank Edward Daza Gonzalez", email = "frank.daza2@gmail.com" },
]
requires-python = "==3.12.12"
dependencies = [
    "fastapi>=0.136.1",
    "pydantic-settings>=2.14.0",
    "python-dotenv>=1.2.2",
    "uvicorn[standard]>=0.46.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.0.0",
    "pytest-asyncio>=1.3.0",
]

[tool.uv.build-backend]
module-name = "src"
module-root = ""

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
