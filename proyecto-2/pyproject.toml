[project]
name = "uao-taam"
version = "0.1.0"
description = "TAAM — Bot posoperatorio M3 (FastAPI, Telegram, LangChain Ruta A)."
authors = [
    { name = "Frank Edward Daza Gonzalez", email = "frank.daza2@gmail.com" },
]
requires-python = "==3.12.12"
dependencies = [
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    "fastapi>=0.136.1",
    "langchain-core>=1.4.0",
    "langchain-openai>=1.2.2",
    "langchain-qdrant>=1.1.0",
    "langchain-text-splitters>=1.1.2",
    "pdfplumber>=0.11.9",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.14.0",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.29",
    "qdrant-client>=1.18.0",
    "sqlalchemy[asyncio]>=2.0.49",
    "tenacity>=9.1.4",
    "uvicorn[standard]>=0.46.0",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.21.0",
    "httpx>=0.28.1",
    "pytest>=8.0.0",
    "pytest-asyncio>=1.3.0",
]

[tool.uv.build-backend]
module-name = "src"
module-root = ""

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration_postgres: prueba contra PostgreSQL TAAM real (EJECUTAR_INTEGRACION_POSTGRES=1)",
]
